<style>
/* Layout: one question per card on Belena's warm sand field, olive ink, B-monogram seal in the header.
   Brand: sand #E2D3B9 (from Belena), deep olive #2E3621 (belenamaldives.com theme colour), logo ivory #EEEAE4. */
:root {
  --bg: #e2d3b9;
  --surface: #f7f3ec;
  --ink: #2e3621;
  --muted: #6c6a57;
  --line: #d9cbb0;
  --accent: #2e3621;
  --accent-soft: #ece2cf;
  --accent-2: #8c7a55;
  --cta: #2e3621;
  --on-accent: #f7f3ec;
  --on-cta: #f7f3ec;
  --danger: #9a3b22;
  --font-display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --font-body: "Jost", "Futura", "Segoe UI", system-ui, sans-serif;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2016; --surface: #252b1e; --ink: #eee6d6; --muted: #b3aa93; --line: #3a412f;
    --accent: #e2d3b9; --accent-soft: #343b2a; --accent-2: #b9a57c; --cta: #e2d3b9; --on-accent: #2e3621; --on-cta: #2e3621; --danger: #e59677;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2016; --surface: #252b1e; --ink: #eee6d6; --muted: #b3aa93; --line: #3a412f;
  --accent: #e2d3b9; --accent-soft: #343b2a; --accent-2: #b9a57c; --cta: #e2d3b9; --on-accent: #2e3621; --on-cta: #2e3621; --danger: #e59677;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-inline: 16px;
}
.wrap { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 18px 28px; gap: 18px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lang { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 3px; }
.lang button { font: inherit; font-size: .82rem; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 6px 11px; border-radius: 2px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.section-tag:empty { display: none; }
.chip { align-self: flex-start; padding: 8px 16px; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.brand { font-family: var(--font-body); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .28em; display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--ink); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--ink); }
.section-tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.progress { height: 3px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .35s ease; }
main { flex: 1; display: flex; flex-direction: column; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 22px; display: flex; flex-direction: column; gap: 18px; animation: rise .32s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .4; } to { transform: none; opacity: 1; } }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.1; letter-spacing: -.005em; }
h1 { font-size: clamp(2.2rem, 8vw, 3.1rem); }
h2 { font-size: clamp(1.6rem, 5.6vw, 2.05rem); }
.qnum { font-family: var(--font-display); font-style: italic; color: var(--accent-2); font-weight: 500; font-size: 1.1rem; }
.hint { color: var(--muted); font-size: .95rem; margin: -8px 0 0; }
p { margin: 0; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 3px; background: transparent; color: var(--ink);
  font: inherit; font-size: 1rem; cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.99); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .78rem; font-weight: 600; color: var(--muted); }
.opt[aria-pressed="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.scale-list { display: grid; gap: 16px; }
.scale-row { display: grid; gap: 8px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
.scale-row:last-child { border-bottom: 0; padding-bottom: 0; }
.scale-label { font-weight: 600; }
.pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pip { padding: 9px 0; border: 1.5px solid var(--line); border-radius: 3px; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.pip:hover { border-color: var(--accent); }
.pip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.anchors { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); gap: 8px; }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 3px; padding: 13px 15px;
}
textarea { min-height: 120px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-color: var(--accent); }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 600; border-radius: 2px; padding: 12px 24px; cursor: pointer; border: 1.5px solid transparent; }
.btn-primary { background: var(--cta); color: var(--on-cta); letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; font-weight: 500; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; font-weight: 500; }
.enter-hint { font-size: .8rem; color: var(--muted); }
.error { color: var(--danger); font-size: .92rem; font-weight: 600; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: .92rem; }
.meta-row span::before { content: "•"; margin-right: 8px; color: var(--accent-2); }
.meta-row span:first-child::before { content: none; }
.notice { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.preview-flag { font-size: .75rem; font-weight: 600; color: var(--cta); border: 1px solid var(--cta); border-radius: 99px; padding: 2px 10px; }
.done-mark { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.done-mark svg { width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pips.with-na { grid-template-columns: repeat(5, 1fr) auto; }
.pip.na { padding-inline: 10px; font-size: .78rem; font-weight: 600; }
.pips.seven { grid-template-columns: repeat(7, 1fr); gap: 4px; }
.pip.dot { display: grid; place-items: center; padding: 10px 0; }
.pip.dot i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); }
.pip.dot:nth-child(1) i, .pip.dot:nth-child(7) i { width: 18px; height: 18px; }
.pip.dot:nth-child(2) i, .pip.dot:nth-child(6) i { width: 15px; height: 15px; }
.pip.dot[aria-pressed="true"] i { border-color: var(--on-accent); background: var(--on-accent); }
.poles { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.opt.rank[aria-pressed="true"] .key { background: var(--cta); border-color: var(--cta); color: var(--on-cta); }
.card.transition { background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); padding-block: 40px 26px; }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .progress > i { transition: none; } }
</style>

/* ===== State ===== */
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const tag = document.getElementById("sectionTag");
const STORE = "belena-survey-draft-v2";
const fresh = () => ({ step: -1, answers: {}, order: {}, startedAt: null });
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.answers) state = { ...fresh(), ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
const clearDraft = () => { try { localStorage.removeItem(STORE); } catch (e) {} };
const visible = () => Q.filter(q => !q.showIf || q.showIf(state.answers));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEYS = "123456789ABCDEFGHIJ";

// Randomise unordered lists once per respondent (order bias), keeping "Other" last.
function ordered(q, list) {
  if (!q.shuffle) return list;
  const key = q.id;
  if (!state.order[key] || state.order[key].length !== list.length) {
    const fixed = q.fixedLast || [];
    const move = list.filter(x => !fixed.includes(x));
    for (let i = move.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [move[i], move[j]] = [move[j], move[i]]; }
    state.order[key] = [...move, ...list.filter(x => fixed.includes(x))];
    save();
  }
  return state.order[key];
}
const opts = q => ordered(q, typeof q.options === "function" ? q.options(state.answers) : q.options);
const rows = q => ordered(q, q.items);
const otherKey = q => q.id + "_other";
function otherChosen(q) { const v = state.answers[q.id]; return q.otherText && (Array.isArray(v) ? v.includes(q.otherText) : v === q.otherText); }

function answered(q) {
  const v = state.answers[q.id];
  if (q.type === "transition" || q.optional) return true;
  if (otherChosen(q) && !(state.answers[otherKey(q)] || "").trim()) return false;
  if (q.type === "scale") return v && q.items.every(it => v[it] != null);
  if (q.type === "bipolar") return v && q.pairs.every(p => v[p.join("–")] != null);
  if (q.type === "rank") return Array.isArray(v) && v.length === Math.min(q.max, q.options.length);
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "text") return typeof v === "string" && v.trim().length > 0;
  return v != null;
}

function render() {
  const list = visible();
  if (state.step < 0) return renderWelcome();
  if (state.step >= list.length) return renderSubmit();
  const q = list[state.step];
  const qs = list.filter(x => x.type !== "transition");
  bar.style.width = Math.round((state.step / list.length) * 100) + "%";
  tag.textContent = t(q.section);
  const nav = last => `
      <div class="nav">
        <button type="button" class="btn btn-ghost" id="back">${t("Back")}</button>
        <span class="enter-hint">${t("Press Enter ↵")}</span>
        <button type="button" class="btn btn-primary" id="next" ${answered(q) ? "" : "disabled"}>${t(last ? "Review and send" : (q.type === "transition" ? "Continue" : "Next"))}</button>
      </div>`;
  if (q.type === "transition") {
    app.innerHTML = `<section class="card transition"><h1>${esc(t(q.text))}</h1><p>${esc(t(q.body))}</p>${nav(false)}</section>`;
    return wire(q);
  }
  const v = state.answers[q.id];
  let body = "";
  if (q.type === "single" || q.type === "multi" || q.type === "rank") {
    const o = opts(q);
    body = `<div class="opts ${o.length > 6 ? "two" : ""}" role="group">` + o.map((opt, i) => {
      const rank = q.type === "rank" ? (v || []).indexOf(opt) + 1 : 0;
      const on = q.type === "single" ? v === opt : (v || []).includes(opt);
      const key = q.type === "rank" ? (rank || "") : (KEYS[i] || "");
      return `<button type="button" class="opt ${q.type === "rank" ? "rank" : ""}" data-i="${i}" aria-pressed="${on}"><span class="key">${key}</span><span>${esc(t(opt))}</span></button>`;
    }).join("") + `</div>`;
    if (q.otherText) body += `<input id="f-other" type="text" placeholder="${t("Please tell us more")}" value="${esc(state.answers[otherKey(q)] || "")}" ${otherChosen(q) ? "" : "hidden"}>`;
  } else if (q.type === "scale") {
    body = `<div class="scale-list">` + rows(q).map((it, r) => `
      <div class="scale-row" data-item="${esc(it)}">
        <div class="scale-label">${esc(t(it))}</div>
        <div class="pips ${q.naItems && q.naItems.includes(it) ? "with-na" : ""}">${[1,2,3,4,5].map(n => `<button type="button" class="pip" data-n="${n}" aria-label="${esc(t(it))}: ${n}" aria-pressed="${v && v[it] === n}">${n}</button>`).join("")}${q.naItems && q.naItems.includes(it) ? `<button type="button" class="pip na" data-n="NA" aria-pressed="${v && v[it] === "NA"}">${t("Doesn't apply")}</button>` : ""}</div>
        <div class="anchors"><span>1 = ${t(q.anchors[0])}</span><span>5 = ${t(q.anchors[1])}</span></div>
      </div>`).join("") + `</div>`;
  } else if (q.type === "bipolar") {
    body = `<div class="scale-list">` + q.pairs.map(p => { const k = p.join("–"); return `
      <div class="scale-row bipolar" data-item="${esc(k)}">
        <div class="poles"><span>${esc(t(p[0]))}</span><span>${esc(t(p[1]))}</span></div>
        <div class="pips seven">${[1,2,3,4,5,6,7].map(n => `<button type="button" class="pip dot" data-n="${n}" aria-label="${esc(t(p[0]))} – ${esc(t(p[1]))}: ${n}" aria-pressed="${v && v[k] === n}"><i></i></button>`).join("")}</div>
      </div>`; }).join("") + `</div>`;
  } else if (q.type === "text") {
    const val = esc(v && v !== q.skipChip ? v : "");
    body = q.long
      ? `<textarea id="f-${q.id}" placeholder="${t("Type your answer")}">${val}</textarea>`
      : `<input id="f-${q.id}" type="text" value="${val}" placeholder="${t("Type your answer")}" ${q.list ? `list="dl-${q.list}" autocomplete="${q.list === "countries" ? "country-name" : "off"}"` : ""}>`
        + (q.list ? `<datalist id="dl-${q.list}">${(q.list === "countries" ? COUNTRIES : GUESTHOUSES).map(c => `<option value="${esc(c)}">`).join("")}</datalist>` : "")
        + (q.skipChip ? `<button type="button" class="btn btn-ghost chip" id="skipChip" aria-pressed="${v === q.skipChip}">${t(q.skipChip)}</button>` : "");
  }
  const note = q.type === "rank" ? `<p class="hint" id="multiNote">${t("{n} of {m} ranked", { n: (v || []).length, m: q.max })}. ${t("Tap again to remove.")}</p>`
    : q.type === "multi" && q.max ? `<p class="hint" id="multiNote">${t("{n} of {m} picked", { n: (v || []).length, m: q.max })}</p>` : "";
  app.innerHTML = `
    <section class="card">
      <span class="qnum">${t("Question {n} of {m}", { n: qs.indexOf(q) + 1, m: qs.length })}</span>
      <h2>${esc(t(q.text))}</h2>
      ${q.hint ? `<p class="hint">${esc(t(q.hint))}</p>` : ""}
      ${body}
      ${note}
      ${nav(state.step === list.length - 1)}
    </section>`;
  wire(q);
}

function wire(q) {
  const next = document.getElementById("next");
  const refresh = () => { next.disabled = !answered(q); save(); };
  document.getElementById("back").onclick = () => { state.step--; save(); render(); };
  next.onclick = advance;
  if (q.type === "transition") return;
  const other = document.getElementById("f-other");
  const showOther = () => { if (!other) return; other.hidden = !otherChosen(q); if (!other.hidden) other.focus({ preventScroll: true }); };
  if (other) other.oninput = () => { state.answers[otherKey(q)] = other.value; refresh(); };
  if (q.type === "single" || q.type === "multi" || q.type === "rank") {
    const o = opts(q);
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const opt = o[+b.dataset.i];
      if (q.type === "single") {
        state.answers[q.id] = opt; save();
        app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b));
        if (q.endIf && q.endIf.includes(opt)) return renderEnd();
        if (otherChosen(q)) { showOther(); return refresh(); }
        if (other) other.hidden = true;
        refresh();
        setTimeout(advance, 260);
      } else {
        let cur = state.answers[q.id] || [];
        if (cur.includes(opt)) cur = cur.filter(x => x !== opt);
        else if (!q.max || cur.length < q.max) cur = [...cur, opt];
        state.answers[q.id] = cur;
        app.querySelectorAll(".opt").forEach(x => {
          const val = o[+x.dataset.i];
          x.setAttribute("aria-pressed", cur.includes(val));
          if (q.type === "rank") x.querySelector(".key").textContent = cur.indexOf(val) + 1 || "";
        });
        const n = document.getElementById("multiNote");
        if (n) n.textContent = q.type === "rank" ? `${t("{n} of {m} ranked", { n: cur.length, m: q.max })}. ${t("Tap again to remove.")}` : t("{n} of {m} picked", { n: cur.length, m: q.max });
        showOther(); refresh();
      }
    });
  } else if (q.type === "scale" || q.type === "bipolar") {
    app.querySelectorAll(".scale-row").forEach(row => {
      const it = row.dataset.item;
      row.querySelectorAll(".pip").forEach(p => p.onclick = () => {
        const val = p.dataset.n === "NA" ? "NA" : +p.dataset.n;
        state.answers[q.id] = { ...(state.answers[q.id] || {}), [it]: val };
        row.querySelectorAll(".pip").forEach(x => x.setAttribute("aria-pressed", x === p));
        refresh();
        const nextRow = row.nextElementSibling;
        if (nextRow && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) nextRow.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  } else {
    const f = document.getElementById("f-" + q.id);
    f.oninput = () => { state.answers[q.id] = f.value; refresh(); };
    f.focus({ preventScroll: true });
    const chip = document.getElementById("skipChip");
    if (chip) chip.onclick = () => { state.answers[q.id] = q.skipChip; f.value = ""; refresh(); advance(); };
  }
}

function advance() {
  const list = visible(), q = list[state.step];
  if (q && !answered(q)) return;
  state.step++; save(); render(); window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const list = visible(), q = list[state.step];
  if (e.key === "Enter") { const n = document.getElementById("next") || document.getElementById("start"); if (n && !n.disabled) { e.preventDefault(); n.click(); } return; }
  if (!q || e.target.tagName === "INPUT" || (q.type !== "single" && q.type !== "multi")) return;
  const i = KEYS.indexOf(e.key.toUpperCase());
  const b = i >= 0 && app.querySelector(`.opt[data-i="${i}"]`);
  if (b) b.click();
});

function renderWelcome() {
  bar.style.width = "0%"; tag.textContent = "";
  const resumable = Object.keys(state.answers).length > 0;
  app.innerHTML = `
    <section class="card">
      ${!SUPABASE_URL ? `<span class="preview-flag" style="align-self:flex-start">${t("Preview: answers are not saved")}</span>` : ""}
      <h1>${t("Why Thoddoo? Tell us about your stay.")}</h1>
      <p>${t("I'm a Bachelor of Marketing student at The Maldives National University, working on a research project with a guesthouse on Thoddoo. This survey asks why you chose Thoddoo and how you chose where to stay.")}</p>
      <div class="meta-row"><span>${t("About 7 minutes")}</span><span>${t("Anonymous")}</span><span>${t("Stop any time")}</span></div>
      <div class="nav">
        ${resumable ? `<button type="button" class="btn btn-ghost" id="restart">${t("Start over")}</button>` : "<span></span>"}
        <button type="button" class="btn btn-primary" id="start">${t(resumable ? "Continue where I left off" : "Start the survey")}</button>
      </div>
      <p class="notice">${t("Your answers are used only for this academic project and contain no names or contact details.")}</p>
    </section>`;
  document.getElementById("start").onclick = () => { if (!state.startedAt) state.startedAt = Date.now(); if (state.step < 0) state.step = 0; save(); render(); };
  const r = document.getElementById("restart"); if (r) r.onclick = () => { state = { ...fresh(), step: 0, startedAt: Date.now() }; save(); render(); };
}

function renderEnd() {
  bar.style.width = "100%"; tag.textContent = "";
  clearDraft(); state = fresh();
  app.innerHTML = `<section class="card"><h2>${t("Thank you for your time")}</h2><p>${t("This survey is for visitors aged 18+ who have stayed on Thoddoo in the last two years, so there are no more questions for you.")}</p></section>`;
}

function renderSubmit() {
  bar.style.width = "100%"; tag.textContent = t("Almost done");
  app.innerHTML = `
    <section class="card">
      <h2>${t("That's everything. Ready to send?")}</h2>
      <p>${t("You can go back and change any answer before sending.")}</p>
      <p id="err" class="error" hidden></p>
      <div class="nav">
        <button type="button" class="btn btn-ghost" id="back">${t("Back")}</button>
        <button type="button" class="btn btn-primary" id="send">${t("Send my answers")}</button>
      </div>
    </section>`;
  document.getElementById("back").onclick = () => { state.step--; save(); render(); };
  document.getElementById("send").onclick = submit;
}

async function submit() {
  const btn = document.getElementById("send"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = t("Sending…"); err.hidden = true;
  const shown = visible().filter(q => q.type !== "transition");
  const keep = new Set(shown.flatMap(q => (otherChosen(q) ? [q.id, otherKey(q)] : [q.id])));
  const answers = Object.fromEntries(Object.entries(state.answers).filter(([k]) => keep.has(k)));
  // Administrative data is captured automatically, so respondents are never asked for it.
  const row = {
    survey_version: SURVEY_VERSION,
    language: lang,
    answers,
    duration_seconds: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : null,
    source: SRC,
  };
  try {
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/responses`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, ...(SUPABASE_ANON_KEY.startsWith("eyJ") ? { Authorization: `Bearer ${SUPABASE_ANON_KEY}` } : {}), "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(row),
      });
      if (!res.ok) throw new Error(res.status);
    } else {
      console.log("Preview mode, not saved:", JSON.stringify(row));
    }
    clearDraft();
    state = fresh();
    renderThanks();
  } catch (e) {
    err.textContent = t("Your answers didn't send. Check your internet connection and press Send again. Nothing you entered has been lost.");
    err.hidden = false; btn.disabled = false; btn.textContent = t("Send my answers");
  }
}

function renderThanks() {
  bar.style.width = "100%"; tag.textContent = "";
  app.innerHTML = `
    <section class="card">
      <div class="done-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>${t("Thank you! Your answers are in.")}</h2>
      <p>${t("They'll help guesthouses on Thoddoo understand their visitors better. Enjoy the rest of your time on the island.")}</p>
    </section>`;
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("belena-survey-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  const bn = document.getElementById("brandName"); if (bn) bn.textContent = t("Thoddoo Visitor Study");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { setLang(b.dataset.lang); render(); });
setLang(lang);
render();
</script>
